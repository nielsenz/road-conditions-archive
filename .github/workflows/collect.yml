name: Collect conditions

on:
  schedule:
    - cron: '*/10 * * * *'  # GitHub may start scheduled runs several minutes late
  workflow_dispatch:
  push:
    paths: ['collect.py', 'tests/**', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests
      - name: Collect
        id: collect
        run: uv run --no-project --python 3.12 python collect.py
      # Commit even when a source newly failed, so health.json records it.
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Conditions $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((attempt * 5))
          done
          exit 1
